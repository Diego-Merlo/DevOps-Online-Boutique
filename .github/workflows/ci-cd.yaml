name: CI/CD Pipeline - Online Boutique

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

jobs:

  unit-tests:
    name: Pruebas Unitarias - PyTest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install flask pytest

      - name: Ejecutar pruebas unitarias
        run: |
          python -m pytest src/recommendationservice/tests/ \
            -v \
            --junitxml=test-results/unit-tests.xml

      - name: Publicar reporte
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-pruebas-unitarias
          path: test-results/unit-tests.xml

  build-and-push:
    name: Build y Push - Docker Hub
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Login a Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏗️ Build y Push imagen
        uses: docker/build-push-action@v4
        with:
          context: ./src/recommendationservice
          file: ./src/recommendationservice/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/online-boutique:recommendation-latest
            ${{ secrets.DOCKERHUB_USERNAME }}/online-boutique:recommendation-v${{ github.run_number }}